<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900"><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif}</style><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f3f7fb" stroke="none" stroke-width="2"/><text x="70" y="66" fill="#087f77" font-size="22" font-weight="700" text-anchor="start">02  /  ファイル本体を送るタイミング</text><text x="70" y="137" fill="#172b46" font-size="46" font-weight="700" text-anchor="start">ファイル本体は「貼り付け」で転送</text><text x="70" y="191" fill="#546a82" font-size="27" font-weight="400" text-anchor="start">コピー直後に、ファイル全体を先読みしない設計。</text><rect x="70" y="248" width="350" height="365" rx="22" fill="#ffffff" stroke="#d5e1eb" stroke-width="2"/><circle cx="124" cy="302" r="25" fill="#058d82"/><text x="124" y="312" fill="white" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="100" y="379" fill="#172b46" font-size="32" font-weight="700" text-anchor="start">コピー</text><text x="100" y="431" fill="#058d82" font-size="23" font-weight="600" text-anchor="start">Ctrl+C</text><text x="100" y="505" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">元ファイルのパスを保持</text><text x="100" y="549" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">本文の先読みはしない</text><rect x="465" y="248" width="350" height="365" rx="22" fill="#ffffff" stroke="#d5e1eb" stroke-width="2"/><circle cx="519" cy="302" r="25" fill="#3279c1"/><text x="519" y="312" fill="white" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="495" y="379" fill="#172b46" font-size="32" font-weight="700" text-anchor="start">参照を共有</text><text x="495" y="431" fill="#3279c1" font-size="23" font-weight="600" text-anchor="start">ファイル名・参照ID</text><text x="495" y="505" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">相手へ参照情報を渡す</text><text x="495" y="549" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">専用ディスクキャッシュなし</text><rect x="860" y="248" width="350" height="365" rx="22" fill="#ffffff" stroke="#d5e1eb" stroke-width="2"/><circle cx="914" cy="302" r="25" fill="#7a58af"/><text x="914" y="312" fill="white" font-size="25" font-weight="700" text-anchor="middle">3</text><text x="890" y="379" fill="#172b46" font-size="32" font-weight="700" text-anchor="start">貼り付け</text><text x="890" y="431" fill="#7a58af" font-size="23" font-weight="600" text-anchor="start">Ctrl+V</text><text x="890" y="505" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">貼り付け先が内容を読む</text><text x="890" y="549" fill="#546a82" font-size="21" font-weight="400" text-anchor="start">既存TLSで分割して転送</text><path d="M428 420 L452 420" stroke="#8aa2b8" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M434 405 L452 420 L434 435" fill="none" stroke="#8aa2b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M823 420 L847 420" stroke="#8aa2b8" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M829 405 L847 420 L829 435" fill="none" stroke="#8aa2b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="662" width="1140" height="116" rx="20" fill="#e2f4f0" stroke="none" stroke-width="2"/><text x="108" y="707" fill="#086d65" font-size="28" font-weight="700" text-anchor="start">長いファイル転送は、進捗・速度・残り時間を表示</text><rect x="109" y="735" width="770" height="13" rx="6" fill="#bbddd5" stroke="none" stroke-width="2"/><rect x="109" y="735" width="462" height="13" rx="6" fill="#07968a" stroke="none" stroke-width="2"/><rect x="973" y="701" width="190" height="48" rx="10" fill="#ffffff" stroke="#86bab0" stroke-width="2"/><text x="1068" y="734" fill="#086d65" font-size="23" font-weight="600" text-anchor="middle">キャンセル</text><text x="70" y="829" fill="#64768a" font-size="18" font-weight="400" text-anchor="start">この図は仕組みの説明用です。進捗バーは実際の転送状態を表すものではありません。</text><text x="70" y="865" fill="#64768a" font-size="18" font-weight="400" text-anchor="start">貼り付け前の本文読み取り0バイトは、ネイティブ連携の自動試験で確認しています。</text></svg>